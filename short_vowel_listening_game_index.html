<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Short Vowel Sound Match</title><style>body{font-family:Arial,sans-serif;background:#f1f7ff;color:#17324d;margin:0;padding:20px}main{max-width:850px;margin:auto;background:white;padding:24px;border-radius:22px;box-shadow:0 8px 30px #cbd9eb}h1{text-align:center;color:#165d9b}button{cursor:pointer;border:0;border-radius:14px;padding:14px;font-size:18px}button:focus-visible{outline:4px solid #f6b93b}.primary{background:#1266b0;color:white;font-weight:bold}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:24px}.choice{background:#f5f9ff;border:3px solid #d0dfef;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:220px}.choice:hover{border-color:#448bd1}.choice .pic{font-size:80px}.choice strong{font-size:26px}.choice small{font-size:14px}.correct{background:#d9f6df!important;border-color:#2e9c50!important}.wrong{background:#ffe5e5!important;border-color:#db5555!important}.feedback{font-size:23px;font-weight:bold;min-height:34px;text-align:center;margin:20px 0}.actions{text-align:center}.muted{color:#536579}.hidden{display:none}@media(max-width:620px){.choices{grid-template-columns:1fr}.choice{min-height:130px;display:grid;grid-template-columns:95px 1fr;gap:5px;text-align:left}.choice .pic{font-size:60px;grid-row:span 2}.choice strong{font-size:25px}main{padding:15px}}</style></head><body><main><h1>🔊 Short Vowel Sound Match</h1><p class="muted" style="text-align:center">Listen to the sound. Find the word with the same middle vowel sound.</p><div class="bar"><strong id="progress">Question 1 of 12</strong><strong id="score">Score: 0</strong></div><hr><div class="actions"><button class="primary" id="sound">🔊 Hear the vowel sound</button><p class="muted">Tap a word to hear it. Then press “Choose this word.”</p></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden">Next question →</button></div><p class="muted" style="font-size:13px;text-align:center">Audio uses your device's English text-to-speech voice. Turn up your volume.</p></main><script>
const words={a:[['cat','🐈'],['hat','🎩'],['map','🗺️'],['bag','🎒'],['fan','🪭'],['pan','🍳'],['jam','🍓'],['bat','🦇']],i:[['pig','🐖'],['fish','🐟'],['pin','📌'],['sit','🪑'],['zip','🤐'],['bib','👶'],['wig','👩‍🦰'],['fin','🦈']],o:[['dog','🐕'],['fox','🦊'],['pot','🍲'],['log','🪵'],['box','📦'],['sock','🧦'],['top','🌀'],['mop','🧹']]};
const rounds=[['a',0],['i',0],['o',0],['a',1],['o',1],['i',1],['a',2],['i',2],['o',2],['i',3],['o',3],['a',3]];let index=0,score=0,answered=false;
function speak(text,rate=.78){if(!('speechSynthesis'in window)){alert('Speech is not supported in this browser. Try Chrome.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;const voices=speechSynthesis.getVoices();const english=voices.find(v=>v.lang.toLowerCase().startsWith('en')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(english)u.voice=english;speechSynthesis.speak(u)}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function render(){answered=false;document.getElementById('next').classList.add('hidden');document.getElementById('feedback').textContent='';document.getElementById('progress').textContent=`Question ${index+1} of ${rounds.length}`;document.getElementById('score').textContent=`Score: ${score}`;const [v,n]=rounds[index];let other=['a','i','o'].filter(x=>x!==v);let options=shuffle([{...{v},w:words[v][n]},...other.map((x,j)=>({v:x,w:words[x][(n+index+j)%words[x].length]}))]);let el=document.getElementById('choices');el.innerHTML='';options.forEach(({v:letter,w:[word,emoji]})=>{let b=document.createElement('div');b.className='choice';b.style.padding='12px';b.innerHTML=`<span class="pic" role="img" aria-label="${word}">${emoji}</span><strong>${word}</strong>`;let hear=document.createElement('button');hear.textContent='🔊 Hear word';hear.style.background='#dcecff';hear.onclick=()=>speak(word);let choose=document.createElement('button');choose.textContent='Choose this word';choose.style.background='#1266b0';choose.style.color='white';choose.onclick=()=>{if(answered)return;answered=true;const good=letter===v;if(good)score++;b.classList.add(good?'correct':'wrong');document.querySelectorAll('.choice button').forEach(x=>{if(x.textContent==='Choose this word')x.disabled=true});document.querySelectorAll('.choice').forEach(c=>{if(c.querySelector('strong').textContent===words[v][n][0])c.classList.add('correct')});document.getElementById('feedback').textContent=good?'⭐ Great listening!':'Good try! Look at the highlighted answer.';document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=index===rounds.length-1?'See my score →':'Next question →'};b.append(hear,choose);el.appendChild(b)});}
document.getElementById('sound').onclick=()=>{let v=rounds[index][0];speak({'a':'ă, ă, apple','i':'ĭ, ĭ, itch','o':'ŏ, ŏ, octopus'}[v],.68)};
document.getElementById('next').onclick=()=>{index++;if(index<rounds.length){render();return;}document.getElementById('choices').innerHTML='';document.getElementById('sound').classList.add('hidden');document.getElementById('progress').textContent='Finished!';document.getElementById('feedback').textContent=`🎉 You got ${score} out of ${rounds.length}!`;document.getElementById('next').textContent='Play again ↻';document.getElementById('next').onclick=()=>location.reload()};render();
</script></body></html>
